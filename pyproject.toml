[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-devin"
version = "0.1.0"
description = "IGRIS - AI Engineering Agent: local-first autonomous coding agent with anti-loop governance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Christian", email = "cricci.solarfox@gmail.com"},
]

dependencies = [
    "openai>=1.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "gitpython>=3.1.40",
    "watchdog>=3.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "numpy>=1.26.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
igris = "igris.cli.main:cli"

[tool.setuptools.packages.find]
include = ["igris*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
