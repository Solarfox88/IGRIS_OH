name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${ matrix.python-version }

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest pytest-asyncio httpx pydantic python-dotenv fastapi uvicorn

      - name: Run tests
        run: python -m pytest -q
